name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs unit tests, the Modulith boundary test, and the Testcontainers
      # integration tests (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: mvn -B verify

  frontend:
    name: Frontend — lint, build & contract sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The typed client must never drift from the OpenAPI contract:
      # regenerate it and fail if the committed file would change.
      - name: Verify API client is in sync with the contract
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api-types.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  stack:
    name: Stack — images & smoke test
    runs-on: ubuntu-latest
    # Every step runs compose, and compose refuses to read the file without this.
    env:
      JWT_SECRET: ci-only-secret-of-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4

      # Builds both images and runs them together, so the Dockerfiles and the
      # compose wiring are proven here rather than on the day of a deploy.
      - name: Start the stack
        run: docker compose up --build --detach

      # Waiting for the app alone is not enough: it answers in seconds while
      # the API behind it is still starting, and the proxy says 502 meanwhile.
      # An unauthenticated call is 401 only once the whole chain is up.
      - name: Wait for the API to answer through the app
        run: |
          for _ in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:3000/api/auth/me || true)
            if [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      # One request exercises the whole chain: the app's own origin, the proxy
      # to the API, the database lookup, and the typed error coming back.
      - name: The API answers through the app's own origin
        run: |
          status=$(curl -s -o response.json -w '%{http_code}' \
            -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"nobody@aether.app","password":"wrong-password"}')
          echo "status=$status body=$(cat response.json)"
          if [ "$status" != "401" ] || ! grep -q invalid_credentials response.json; then
            docker compose logs
            exit 1
          fi

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
