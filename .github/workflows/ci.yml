name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Runs unit tests, the Modulith boundary test, and the Testcontainers
      # integration tests (Docker is available on GitHub-hosted runners).
      - name: Build and test
        run: mvn -B verify

  frontend:
    name: Frontend — lint, build & contract sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The typed client must never drift from the OpenAPI contract:
      # regenerate it and fail if the committed file would change.
      - name: Verify API client is in sync with the contract
        run: |
          npm run generate:api
          git diff --exit-code -- lib/api-types.ts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
