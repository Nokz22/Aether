spring:
  application:
    name: aether

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aether}
    username: ${DB_USERNAME:aether}
    password: ${DB_PASSWORD:aether}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration
