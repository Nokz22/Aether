spring:
  application:
    name: aether

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aether}
    username: ${DB_USERNAME:aether}
    password: ${DB_PASSWORD:aether}

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    locations: classpath:db/migration

aether:
  security:
    # Dev-only default — every real environment must set JWT_SECRET (min. 32 bytes).
    jwt-secret: ${JWT_SECRET:aether-dev-only-jwt-secret-do-not-use-in-production}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Closed by default: after the first account, registration needs explicit opt-in.
    open-registration: ${OPEN_REGISTRATION:false}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
