openapi: 3.0.3
info:
  title: AETHER API
  version: 0.1.0
  description: >
    Contract for the AETHER backend. The frontend consumes typed clients
    generated from this file — the two sides never drift silently.

servers:
  - url: http://localhost:8080

tags:
  - name: auth
  - name: habits
  - name: notes
  - name: projects

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Create an account (closed after the first one unless open-registration is enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Account created; refresh token set as an httpOnly cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated; refresh token set as an httpOnly cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ApiError" }

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and mint a new access token
      description: Reads the `aether_refresh` cookie; each token is single-use.
      responses:
        "200":
          description: New access token; rotated refresh token set as cookie.
          headers:
            Set-Cookie: { $ref: "#/components/headers/RefreshCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/ApiError" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token and clear its cookie
      responses:
        "204":
          description: Logged out.

  /api/auth/me:
    get:
      tags: [auth]
      summary: The authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
          description: Current user.
        "401": { $ref: "#/components/responses/ApiError" }

  /api/habits:
    get:
      tags: [habits]
      summary: List the user's habits with today's state, streak and last 7 days
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Today"
      responses:
        "200":
          description: Habits ordered by creation.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HabitResponse" }
        "401": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [habits]
      summary: Create a habit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHabitRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HabitSummary" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ApiError" }

  /api/habits/{habitId}:
    patch:
      tags: [habits]
      summary: Rename a habit
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HabitId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenameHabitRequest" }
      responses:
        "204": { description: Renamed. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [habits]
      summary: Delete a habit and its history
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HabitId"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/ApiError" }

  /api/habits/{habitId}/checkins/{date}:
    put:
      tags: [habits]
      summary: Mark the habit done on a day (idempotent; future days refused)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HabitId"
        - $ref: "#/components/parameters/CheckinDate"
        - $ref: "#/components/parameters/Today"
      responses:
        "204": { description: Marked. }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [habits]
      summary: Unmark the habit on a day (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/HabitId"
        - $ref: "#/components/parameters/CheckinDate"
      responses:
        "204": { description: Unmarked. }
        "404": { $ref: "#/components/responses/ApiError" }

  /api/notes:
    get:
      tags: [notes]
      summary: List the user's notes, most recently edited first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Note summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/NoteSummary" }
        "401": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [notes]
      summary: Create a note
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNoteRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ApiError" }

  /api/notes/{noteId}:
    get:
      tags: [notes]
      summary: Get a note in full
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "200":
          description: The note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      tags: [notes]
      summary: Update a note (partial; omitted fields are left unchanged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateNoteRequest" }
      responses:
        "200":
          description: The updated note.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [notes]
      summary: Delete a note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/NoteId"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/ApiError" }

  /api/projects:
    get:
      tags: [projects]
      summary: List the user's projects with task counts per state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/ApiError" }
    post:
      tags: [projects]
      summary: Create a project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProjectRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/ApiError" }

  /api/projects/{projectId}:
    get:
      tags: [projects]
      summary: Get a project with its tasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "404": { $ref: "#/components/responses/ApiError" }
    patch:
      tags: [projects]
      summary: Update a project (partial; omitted fields are left unchanged)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProjectRequest" }
      responses:
        "200":
          description: The updated project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [projects]
      summary: Delete a project and its tasks
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/ApiError" }

  /api/projects/{projectId}/tasks:
    post:
      tags: [projects]
      summary: Add a task to a project (starts as TODO)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/ApiError" }

  /api/projects/{projectId}/tasks/{taskId}:
    patch:
      tags: [projects]
      summary: Update a task's title or status (partial)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200":
          description: The updated task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "404": { $ref: "#/components/responses/ApiError" }
    delete:
      tags: [projects]
      summary: Delete a task
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/ApiError" }

components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    NoteId:
      name: noteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Today:
      name: today
      in: query
      required: true
      description: The client's local date — the server never guesses timezones.
      schema: { type: string, format: date }
    HabitId:
      name: habitId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CheckinDate:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    RefreshCookie:
      description: >
        `aether_refresh` — httpOnly, Secure, SameSite=Strict, path=/api/auth.
        Never readable by frontend code.
      schema: { type: string }

  responses:
    ApiError:
      description: Typed error; `code` is stable and translated by the frontend.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Bean-validation failure with per-field messages.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 72 }
        displayName: { type: string, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    TokenResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT, valid for 15 minutes; sent as `Authorization Bearer`.
        user: { $ref: "#/components/schemas/UserResponse" }

    UserResponse:
      type: object
      required: [id, email, displayName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }

    CreateHabitRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    RenameHabitRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }

    HabitSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    HabitDay:
      type: object
      required: [date, done]
      properties:
        date: { type: string, format: date }
        done: { type: boolean }

    HabitResponse:
      type: object
      required: [id, name, doneToday, currentStreak, week]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        doneToday: { type: boolean }
        currentStreak: { type: integer, minimum: 0 }
        week:
          type: array
          description: The last 7 days, oldest first, ending today.
          items: { $ref: "#/components/schemas/HabitDay" }

    CreateNoteRequest:
      type: object
      required: [content]
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, minLength: 1, maxLength: 50000 }

    UpdateNoteRequest:
      type: object
      description: Partial update — omit a field to leave it unchanged.
      properties:
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 50000 }

    NoteSummary:
      type: object
      required: [id, title, preview, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        preview:
          type: string
          description: First non-blank line of the content, capped — a label for titleless notes.
        updatedAt: { type: string, format: date-time }

    NoteResponse:
      type: object
      required: [id, title, content, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [TODO, DOING, DONE]

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    UpdateProjectRequest:
      type: object
      description: Partial update — omit a field to leave it unchanged.
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }

    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }

    UpdateTaskRequest:
      type: object
      description: Partial update — omit a field to leave it unchanged.
      properties:
        title: { type: string, maxLength: 300 }
        status: { $ref: "#/components/schemas/TaskStatus" }

    TaskResponse:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { $ref: "#/components/schemas/TaskStatus" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TaskCounts:
      type: object
      required: [todo, doing, done]
      properties:
        todo: { type: integer, minimum: 0 }
        doing: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }

    ProjectSummary:
      type: object
      required: [id, name, taskCounts, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        taskCounts: { $ref: "#/components/schemas/TaskCounts" }
        updatedAt: { type: string, format: date-time }

    ProjectResponse:
      type: object
      required: [id, name, description, createdAt, updatedAt, tasks]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskResponse" }

    ApiError:
      type: object
      required: [code, message, fields]
      properties:
        code:
          type: string
          description: >
            Stable machine-readable code, e.g. invalid_credentials,
            registration_closed, email_already_used, invalid_refresh_token,
            validation_failed.
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Per-field messages when code is validation_failed.
